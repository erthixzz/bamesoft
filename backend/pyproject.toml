[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bamesoft-api"
version = "0.1.0"
description = "Bamesoft — Biomedical Asset Management & Engineering Software (API)"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Bamesoft" }]
# Todas las dependencias llevan techo de versión.
#
# Sin él, `pip install` resuelve la última versión publicada el día que se
# instala, así que local, CI y Render podían acabar con versiones distintas sin
# que nadie lo decidiera. Ya pasó dos veces: FastAPI saltó de 0.136 a 0.141 y
# cambió cómo expone las rutas (rompió el gate de autorización), y ruff estrenó
# reglas que dejaron el CI en rojo.
#
# Los techos están justo por encima de la última versión verificada, así que los
# parches entran solos y un salto mayor exige revisarlo a mano.
dependencies = [
  "fastapi>=0.115,<0.142",
  "uvicorn[standard]>=0.30,<0.47",
  "sqlalchemy>=2.0.30,<2.1",
  "asyncpg>=0.29,<0.32",
  "alembic>=1.13,<2",
  "pydantic[email]>=2.7,<3",
  "pydantic-settings>=2.3,<3",
  "python-jose[cryptography]>=3.3,<4",
  "passlib[bcrypt]>=1.7,<2",
  "supabase>=2.5,<3",
  "httpx>=0.27,<0.29",
  "python-multipart>=0.0.9,<0.1",
  "qrcode[pil]>=7.4,<9",
  "loguru>=0.7,<0.8",
  "python-dateutil>=2.9,<3",
  "orjson>=3.10,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<10",
  "pytest-asyncio>=0.23,<2",
  "pytest-cov>=5.0,<8",
  "httpx>=0.27,<0.29",
  "ruff>=0.15,<0.16",
  "mypy>=1.10,<3",
  "types-python-jose",
  "types-passlib",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF"]
# B008 — FastAPI usa Depends() en valores por defecto.
# UP037 — SQLAlchemy 2.0 necesita los forward refs como strings reales.
# A005 — algunos módulos comparten nombre con stdlib (logging.py, errors.py); aceptable.
# N811 — alias `PgEnum` para `ENUM` mejora legibilidad.
# E741 — `I` es nombre canónico de la clase de riesgo IEC.
ignore = ["B008", "UP037", "A005", "N811", "E741"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
testpaths = ["tests"]
